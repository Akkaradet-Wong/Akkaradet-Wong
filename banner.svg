<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="auto">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d1b" />
      <stop offset="35%" stop-color="#091734" />
      <stop offset="75%" stop-color="#0e2450" />
      <stop offset="100%" stop-color="#133166" />
    </linearGradient>

    <radialGradient id="auroraGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#060d1b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.14" />
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#1e40af" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Background with deep rounded corners -->
  <rect width="850" height="220" rx="20" fill="url(#skyGrad)" />
  <rect width="850" height="220" rx="20" fill="url(#auroraGlow)" />
  <rect width="850" height="220" rx="20" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.18" />

  <!-- Soft Calm Waves -->
  <path d="M 0 162 C 200 135, 380 188, 580 156 C 700 136, 780 166, 850 152 L 850 220 L 0 220 Z" fill="url(#wave2)" />
  <path d="M 0 178 C 240 152, 450 198, 650 172 C 750 158, 800 182, 850 168 L 850 220 L 0 220 Z" fill="url(#wave1)" />

  <!-- Centered Calm Typography -->
  <g text-anchor="middle" transform="translate(425, 0)">
    <text x="0" y="54" fill="#7dd3fc" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="3.5">PORTFOLIO &amp; SHOWCASE</text>
    
    <text x="0" y="100" fill="#f8fafc" font-size="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="0.6">Akkaradet Wongbamrap</text>
    
    <rect x="-195" y="122" width="390" height="30" rx="15" fill="#08142b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" />
    <text x="0" y="142" fill="#bae6fd" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" letter-spacing="0.6">Web • Mobile Application • IoT &amp; Embedded Systems</text>
  </g>
</svg>
